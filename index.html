ралы сұраққа дерек арқылы жауап іздеу", "skills": "Биология, зерттеу сұрағы, дәлел", "try": "Жапырақтардың суреттерін белгілері бойынша салыстыру", "hard": "Бір бақылаудан сенімді қорытынды шығару қиын"}, {"name": "Графикалық дизайнер", "work": "Ақпаратты оқуға ыңғайлы көрініске келтіру", "skills": "Бейнелеу, мәтінмен жұмыс, көрерменді түсіну", "try": "Бір хабарландырудың екі постерін жасау", "hard": "Тапсырыс берушінің кері байланысымен қайта өңдеу қажет"}, {"name": "Журналист", "work": "Сұрақ қою, деректі тексеру, түсінікті материал дайындау", "skills": "Тіл, сауатты жазу, ақпаратты тексеру", "try": "Мектеп үйірмесі туралы үш сұрақ пен қысқа мәтін әзірлеу", "hard": "Ақпараттың шынайылығын тексеруге уақыт кетеді"}, {"name": "Мұғалім", "work": "Тақырыпты түсіндіру, тапсырма құру, түсінуді тексеру", "skills": "Пән білімі, тіл, шыдам, кері байланыс", "try": "Бір тақырыпқа үш минуттық түсіндіру дайындау", "hard": "Әр оқушыға әртүрлі түсіндіру қажет болуы мүмкін"}, {"name": "Әлеуметтік қызметкер", "work": "Адамның қолдау қажеттілігін анықтап, қызметтерге бағыттау", "skills": "Қарым-қатынас, тыңдау, ақпаратты реттеу", "try": "Ойдан алынған жаңа оқушыға мектеппен танысу жоспарын жасау", "hard": "Күрделі жағдайларда кәсіби шекараны сақтау керек"}, {"name": "Жоба менеджері", "work": "Мақсат, міндет, уақыт және команда жұмысын үйлестіру", "skills": "Жоспарлау, келісу, мәселе шешу", "try": "Мектеп іс-шарасының тапсырмаларын төрт рөлге бөлу", "hard": "Қатысушылардың уақыты мен қажеттілігі сәйкес келмеуі мүмкін"}, {"name": "Маркетинг маманы", "work": "Адамдардың қажеттілігін зерттеп, өнімнің пайдасын түсіндіру", "skills": "Тіл, талдау, шығармашылық, адал коммуникация", "try": "Ойдан алынған пайдалы өнімді екі аудиторияға таныстыру", "hard": "Тек әдемі жарнама жеткіліксіз, нақты қажеттілік керек"}, {"name": "Логист", "work": "Заттардың жеткізілу жолы мен уақытын жоспарлау", "skills": "Математика, география, ұйымдастыру", "try": "Қағаз картада үш нүктеге жеткізу ретін салыстыру", "hard": "Кідірістер кезінде жоспарды өзгерту керек"}, {"name": "Бухгалтер", "work": "Операцияларды тіркеу, есептер мен құжаттардың сәйкестігін тексеру", "skills": "Математика, ұқыптылық, ережені түсіну", "try": "Ойдан алынған шағын іс-шара бюджетін тексеру", "hard": "Ұсақ қателердің өзі есепке әсер етуі мүмкін"}];let answers={},pos=0,view='home';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(t){view=t;document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['home','test','careers','plan'][i]===t));render()}
function render(){let e=$('main');if(view==='home'){e.innerHTML=`<h2>Қош келдің!</h2><p>Бұл жерде 24 сұраққа жауап беріп, алты қызығушылық бағытыңды зерттей аласың. Жауаптар: 0 — ұнамайды, 1 — аздап қызықты, 2 — қатты қызықты, ? — әлі байқап көрмедім.</p><p class="muted">Тест міндетті емес. Нәтиже саған мамандықты таңдап бермейді.</p><button onclick="tab('test')">Сауалнаманы бастау</button>`;return}
if(view==='test'){if(pos>=24){result();return}let item=Q.items[pos],a=answers[item.id];e.innerHTML=`<h2>Қызығушылық сауалнамасы</h2><p class="muted">Сұрақ ${pos+1} / 24</p><div class="progress"><div style="width:${pos/24*100}%"></div></div><h3>${esc(item.text)}</h3><div class="answers">${[['0','Ұнамайды'],['1','Аздап қызықты'],['2','Қатты қызықты'],['?','Әлі байқап көрмедім']].map(([v,t])=>`<button class="answer ${a===v?'selected':''}" onclick="setAnswer('${v}')">${t}</button>`).join('')}</div><div class="actions"><button ${pos===0?'disabled':''} onclick="pos--;render()">Артқа</button><button ${a===undefined?'disabled':''} onclick="pos++;render()">${pos===23?'Нәтижені көру':'Келесі'}</button></div>`;return}
if(view==='careers'){e.innerHTML=`<h2>Мамандықтармен танысу</h2><p class="muted">Бастапқы материалдағы 12 мамандық. Пәндер — ресми ҰБТ жұбы емес.</p><div class="cards">${careers.map(c=>`<article class="career"><h3>${esc(c.name)}</h3><p><b>Не істейді?</b> ${esc(c.work)}</p><p><b>Пайдалы дағды:</b> ${esc(c.skills)}</p><p><b>Байқап көр:</b> ${esc(c.try)}</p><small>Қиындық: ${esc(c.hard)}</small></article>`).join('')}</div>`;return}
if(view==='plan'){e.innerHTML='<h2>7 күндік зерттеу жоспары</h2>'+['Ұнайтын үш іс пен екі сұрақты жаз (10 мин)','Бір мамандықтың үш міндетін зертте (15 мин)','Екінші мамандықпен салыстыр (15 мин)','Бір қауіпсіз практикалық сынақ орында (20–30 мин)','Демалыс','Не ұнағанын және қиындығын талда (15 мин)','Келесі аптаға бір нақты қадам таңда (10 мин)'].map((x,i)=>`<p><b>${i+1}-күн.</b> ${x}</p>`).join('')}}
function setAnswer(v){answers[Q.items[pos].id]=v;render()}
function result(){let groups=Object.entries(Q.domains).map(([code,label])=>{let its=Q.items.filter(x=>x.domain===code),vals=its.map(x=>answers[x.id]),known=vals.filter(x=>['0','1','2'].includes(x));return{code,label,known:known.length,score:known.length===4?known.reduce((s,x)=>s+Number(x),0):null}}),complete=groups.every(x=>x.score!==null),zero=complete&&groups.every(x=>x.score===0),rank=complete?[...groups].sort((a,b)=>b.score-a.score):[];let summary=complete&&!zero?'Зерттеуге болатын бағыттар: '+rank.filter(x=>x.score===rank[0].score).map(x=>x.label).join(', '):zero?'Бұл сұрақтар бойынша айқын қызығушылық байқалмады. Өзіңе ұнайтын басқа әрекеттерді зертте.':'Белгісіз жауаптар бар: толық рейтинг есептелмейді.';
$('main').innerHTML=`<h2>Менің қызығушылық картам</h2><p>${esc(summary)}</p>${groups.map(x=>`<div class="metric"><b>${esc(x.label)}</b> — ${x.score===null?`${x.known}/4 жауап`:`${x.score}/8`}<div class="bar"><div style="width:${x.score===null?0:x.score/8*100}%"></div></div></div>`).join('')}<p class="muted">Бұл ұпай қабілетті немесе болашақтағы табысты өлшемейді. Бірдей ұпайлар тең нәтиже болып саналады.</p><textarea readonly id="summary">КәсіпAI 0.2.0 нәтижесі\n${groups.map(x=>x.code+': '+(x.score===null?'толық емес':x.score+'/8')).join('\n')}\n${summary}\nМамандық туралы кеңес алғым келеді.</textarea><div class="actions"><button onclick="copyResult()">Нәтижені көшіру</button><button onclick="pos=0;answers={};tab('test')">Қайта бастау</button></div><p class="muted">Көшірілген мәтінді КәсіпAI ChatGPT плагиніне жіберіп, бағыттарды талқылай аласың.</p>`}
function copyResult(){let t=$('summary');t.select();if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t.value).then(()=>alert('Көшірілді')).catch(()=>alert('Мәтінді белгілеп Ctrl+C басыңыз'));else alert('Мәтінді белгілеп Ctrl+C басыңыз')}
